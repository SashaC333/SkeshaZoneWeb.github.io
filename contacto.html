<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>

  <link rel="stylesheet" href="css/generalStyle.css" />
  <link rel="stylesheet" href="css/headerStyle.css" />
  <link rel="stylesheet" href="css/footerStyle.css" />
  <link rel="stylesheet" href="css/forms.css">
</head>

<body>

  <header class="header">
    <nav class="nav">

      <div class="nav__logo" id="start">
        <a href="index.html">
          <img src="icons/LG.svg" alt="Logo">
        </a>
      </div>

      <ul class="nav__list">
        <li><a href="index.html" class="nav__link">Inicio</a></li>
        <li><a href="servicios.html" class="nav__link">Servicios</a></li>
        <li><a href="nosotros.html" class="nav__link">Nosotros</a></li>
        <li><a href="contacto.html" class="nav__link">Contacto</a></li>
      </ul>

      <button class="nav__toggler" id="navToggler">
        <img src="icons/menu.svg" alt="Menú">
      </button>

    </nav>
  </header>

  <!-- SIDE MENU -->
  <div class="sidepanel" id="mySidepanel">
    <a href="javascript:void(0)" id="sidepanelClose">&times;</a>
    <a href="index.html">Inicio</a>
    <a href="servicios.html">Servicios</a>
    <a href="nosotros.html">Nosotros</a>
    <a href="contacto.html">Contacto</a>
  </div>

  <main class="main-content">

    <div class="contact_page">

      <div class="contact_card_page">

        <h2 class="contacto_titulo_seccion">Contacto</h2>

        <div class="contact_container">

          <h1 class="contact_title">Contáctanos</h1>

          <form id="contact_form">

            <!-- NOMBRE + USUARIO -->
            <div class="contact_row">

              <div class="contact_field contact_field_2">
                <label class="contact_label">Nombre:</label>
                <input type="text" id="contact_nombre" name="nombre" class="contact_input" required>
              </div>

              <div class="contact_field contact_field_1">
                <label class="contact_label">Usuario / Red social:</label>
                <input type="text" id="contact_usuario" name="usuario" class="contact_input" required>
              </div>

            </div>

            <!-- CORREO -->
            <div class="contact_full">
              <label class="contact_label">Correo electrónico:</label>
              <input type="email" id="contact_gmail" name="gmail" class="contact_input" required>
            </div>

            <!-- TITULO + SERVICIO -->
            <div class="contact_row">

              <div class="contact_field contact_field_2">
                <label class="contact_label">Título de solicitud:</label>
                <input type="text" id="contact_peticion" name="peticion" class="contact_input" required>
              </div>

              <div class="contact_field contact_field_1">
                <label class="contact_label">Servicio:</label>
                <select id="contact_servicio" name="servicio" class="contact_input" required>
                  <option value="">Selecciona una opción</option>
                  <option value="Portada">Portada</option>
                  <option value="Hoja de personaje">Hoja de personaje</option>
                  <option value="Boceto">Boceto</option>
                  <option value="Retrato">Retrato</option>
                </select>
              </div>

            </div>

            <!-- DESCRIPCIÓN -->
            <div class="contact_full">
              <label class="contact_label">Descripción:</label>
              <textarea id="contact_descripcion" name="descripcion" class="contact_textarea" rows="6" required></textarea>
            </div>

            <button type="submit" class="contact_button" id="contact_button">
              Enviar
            </button>

            <p class="contact_message" id="contact_message"></p>

          </form>

        </div>

      </div>

    </div>

  </main>

  <!-- EMAILJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    emailjs.init({
      publicKey: "a03-u9mtEyj-2rDAV"
    });
  </script>

  <script src="js/contact.js"></script>

</body>
</html>
